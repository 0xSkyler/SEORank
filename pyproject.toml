[build-system]
requires=["setuptools>=69"]
build-backend="setuptools.build_meta"

[project]
name="serp-sentinel"
version="0.1.0"
requires-python=">=3.12"
dependencies=["PySide6>=6.7","playwright>=1.47","qasync>=0.27","selectolax>=0.3.21","lxml>=5.3","pydantic-settings>=2.5","SQLAlchemy>=2.0","keyring>=25","pyqtgraph>=0.13","openpyxl>=3.1","PyYAML>=6.0","tldextract>=5.1","psutil>=6.0"]

[project.optional-dependencies]
dev=["pytest>=8","pytest-asyncio>=0.24","pytest-qt>=4.4","ruff>=0.6","mypy>=1.11"]
build=["pyinstaller>=6.10"]

[project.scripts]
serp-sentinel="serp_sentinel.cli:main"
serp-sentinel-gui="serp_sentinel.app:main"

[tool.setuptools.packages.find]
where=["src"]

[tool.ruff]
line-length=100

[tool.ruff.lint]
ignore=["I001","BLE001","S110"]

[tool.pytest.ini_options]
pythonpath=["src"]
asyncio_mode="auto"
