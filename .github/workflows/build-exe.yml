name: Build Windows EXE

on:
  push:
    branches:
      - feat/serp-sentinel-v0.1.0
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Offline tests
        run: pytest -q

      - name: Build portable EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name SerpSentinel --paths src --hidden-import qasync run_gui.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SerpSentinel-Windows-Portable
          path: dist/SerpSentinel.exe
          if-no-files-found: error
